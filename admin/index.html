<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUMBFLIX — Administracja</title><link rel="icon" type="image/png" href="/favicon.png"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#3c0a14,transparent 40%),#09090d;color:white;font:16px Arial,sans-serif}header{padding:22px max(20px,5vw);border-bottom:1px solid #30303a;display:flex;justify-content:space-between;align-items:center}h1{color:#e50914;margin:0;font-size:28px}main{max-width:1000px;margin:45px auto;padding:0 20px}.box{background:#17171f;border:1px solid #343440;border-radius:15px;padding:25px;margin-bottom:22px}input,textarea,select{display:block;width:100%;margin:7px 0 17px;padding:12px;border:1px solid #444453;border-radius:8px;background:#24242e;color:white;font:inherit}textarea{min-height:90px}label{font-size:14px;color:#d4d4dc}button{border:0;border-radius:7px;background:#e50914;color:white;padding:12px 18px;cursor:pointer;font-weight:bold;margin:4px 8px 4px 0}.secondary{background:#34343e}.danger{background:#8c1a28}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #30303a;padding:12px 0}.row strong{display:block}.muted{color:#a9a9b6;font-size:13px}#message{min-height:24px;color:#ffb2b6}a{color:#eee}#app{display:none}@media(max-width:600px){.row{display:block}}
</style></head><body><header><h1>PUMBFLIX <span style="color:white;font-size:14px">/ ADMIN</span></h1><a href="/">← Strona główna</a></header><main><p id="message" role="status"></p><section class="box" id="loginBox"><h2>Logowanie administratora</h2><form id="loginForm"><label>E-mail konta administratora<input type="email" id="email" autocomplete="username" required></label><label>Hasło<input type="password" id="password" autocomplete="current-password" required></label><button>Zaloguj</button></form><p class="muted">Logowanie nickiem TEKZZ zostanie dodane po uruchomieniu bezpiecznej funkcji serwerowej. Hasła nie są przechowywane na GitHub.</p></section><section id="app"><div class="box"><h2 id="greeting">Panel administratora</h2><button class="secondary" id="logout">Wyloguj</button></div><div class="box"><h2 id="formTitle">Dodaj film</h2><form id="movieForm"><label>Tytuł<input id="tytul" required maxlength="200"></label><label>Typ<input id="typ" value="Film"></label><label>Kategoria<input id="kategoria" value="Inne"></label><label>Opis<textarea id="opis"></textarea></label><label>Link Google Drive<input id="link" type="url" required placeholder="https://drive.google.com/file/d/.../view"></label><label>Link do plakatu<input id="plakat" type="url" placeholder="https://..."></label><button id="submitBtn">Zapisz film</button><button type="button" class="secondary" id="cancel">Anuluj edycję</button></form></div><div class="box"><h2>Filmy</h2><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://baclnodzztvctqpnyvrw.supabase.co','sb_publishable_XmykZIkmy9Nzl3RKPmHwow_qFblt7j-');
const $=id=>document.getElementById(id);let me=null,role=null,rows=[],editing=null;
function msg(t){$('message').textContent=t}function driveOK(v){try{let u=new URL(v);return u.protocol==='https:'&&['drive.google.com','docs.google.com'].includes(u.hostname)&&(/\/file\/d\/[\w-]{10,}/.test(u.pathname)||/^[\w-]{10,}$/.test(u.searchParams.get('id')||''))}catch{return false}}
function show(){let ok=!!me&&!!role;$('app').style.display=ok?'block':'none';$('loginBox').style.display=ok?'none':'block';if(ok)$('greeting').textContent=(role.login||'Administrator')+' · '+role.rola}
async function init(){try{const {data:{user}}=await db.auth.getUser();me=user;if(me){const {data,error}=await db.from('administratorzy').select('login,rola').eq('user_id',me.id).maybeSingle();if(error)throw error;role=data||null;if(!role)msg('To konto nie ma uprawnień administratora.');}else role=null;show();if(role)await load()}catch(e){msg(e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('Logowanie...');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){msg('Nie udało się zalogować: '+error.message);return}msg('');await init()};
$('logout').onclick=async()=>{await db.auth.signOut();me=role=null;show();msg('Wylogowano.')};
async function load(){const {data,error}=await db.from('filmy').select('*').order('id',{ascending:false});if(error){msg('Błąd pobierania filmów: '+error.message);return}rows=data||[];const list=$('list');list.replaceChildren();if(!rows.length)list.textContent='Brak filmów.';for(const r of rows){const item=document.createElement('div');item.className='row';const label=document.createElement('div');const strong=document.createElement('strong');strong.textContent=r.tytul;label.append(strong);const sub=document.createElement('span');sub.className='muted';sub.textContent=(r.kategoria||'')+' · '+(r.administrator_id===me.id?'Twój film':'Inny administrator');label.append(sub);item.append(label);if(r.administrator_id===me.id||role.rola==='owner'){const actions=document.createElement('div');const edit=document.createElement('button');edit.textContent='Edytuj';edit.className='secondary';edit.onclick=()=>editMovie(r);const del=document.createElement('button');del.textContent='Usuń';del.className='danger';del.onclick=()=>deleteMovie(r);actions.append(edit,del);item.append(actions)}list.append(item)}}
function editMovie(r){editing=r.id;for(const k of ['tytul','typ','kategoria','opis','link','plakat'])$(k).value=r[k]||'';$('formTitle').textContent='Edytuj film';window.scrollTo({top:0,behavior:'smooth'})}
function reset(){editing=null;$('movieForm').reset();$('formTitle').textContent='Dodaj film'}$('cancel').onclick=reset;
$('movieForm').onsubmit=async e=>{e.preventDefault();if(!me||!role)return;const payload={};for(const k of ['tytul','typ','kategoria','opis','link','plakat'])payload[k]=$(k).value.trim();if(!driveOK(payload.link)){msg('Wpisz prawidłowy link do pliku Google Drive.');return}msg('Zapisywanie...');let result;if(editing!==null){result=await db.from('filmy').update(payload).eq('id',editing)}else{payload.administrator_id=me.id;result=await db.from('filmy').insert(payload)}if(result.error){msg('Błąd zapisu: '+result.error.message);return}reset();msg('Zapisano.');await load()};
async function deleteMovie(r){if(!confirm('Usunąć film „'+r.tytul+'”?'))return;const {error}=await db.from('filmy').delete().eq('id',r.id);if(error)msg('Błąd usuwania: '+error.message);else{msg('Usunięto.');await load()}}
init();
</script></body></html>
