<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>PUMBFLIX — oglądaj po swojemu</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23101014%22%2F%3E%3Cpath%20d%3D%22M13%2011h14l12%2021-12%2021H13l12-21z%22%20fill%3D%22%23e50914%22%2F%3E%3Cpath%20d%3D%22M32%2011h11l12%2021-12%2021H32l12-21z%22%20fill%3D%22%23ff3945%22%20opacity%3D%22.9%22%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="PUMBFLIX — autorska biblioteka filmowa. Odkrywaj i oglądaj filmy.">
<style>
:root{--bg:#09090d;--panel:#15151d;--muted:#a5a5b2;--red:#e50914;--line:#292934}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 Arial,sans-serif;overflow-x:hidden}body::before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 75% 18%,#e5091410,transparent 40%);pointer-events:none;z-index:-1}
header{height:72px;display:flex;align-items:center;gap:28px;padding:0 5%;position:sticky;top:0;background:#09090de8;backdrop-filter:blur(18px);z-index:5;border-bottom:1px solid #20202a;animation:dropIn .9s both}
.logo{font-size:27px;font-weight:900;color:var(--red);letter-spacing:1px;text-shadow:0 0 28px #e5091450}.nav{display:flex;gap:18px}.nav a{color:#ddd;text-decoration:none;cursor:pointer;transition:color .3s}.nav a:hover{color:#fff}
.actions{margin-left:auto;display:flex;gap:10px;align-items:center}button{border:0;border-radius:6px;padding:10px 15px;font-weight:700;cursor:pointer;background:#292934;color:#fff;transition:transform .3s,background .3s,box-shadow .3s}button:hover{transform:translateY(-2px)}.primary{background:var(--red)}.primary:hover{box-shadow:0 10px 35px #e5091455}input{background:#20202a;border:1px solid #383845;border-radius:6px;color:#fff;padding:11px;width:100%;font:inherit}.search{width:min(220px,30vw)}
main{max-width:1400px;margin:auto;padding:0 5% 60px}.hero{margin:26px 0 38px;min-height:360px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(90deg,#111 0%,#17121a 55%,#351015 100%);display:flex;align-items:end;padding:38px;isolation:isolate;animation:heroAppear 1.5s cubic-bezier(.2,.8,.2,1) both}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,#e5091444,transparent 32%);animation:glow 8s ease-in-out infinite alternate;z-index:-1}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#09090d 0%,transparent 70%);pointer-events:none;z-index:-1}.hero-content{max-width:620px}.eyebrow{color:#ff626a;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1;margin:10px 0;letter-spacing:-1px}.hero p{color:#d0cfd5;max-width:550px}.hero .eyebrow,.hero h1,.hero p,.hero button{animation:rise 1s both}.hero h1{animation-delay:.25s}.hero p{animation-delay:.5s}.hero button{animation-delay:.7s}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}.section-head h2{margin:0;font-size:22px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}.movie{background:var(--panel);border:1px solid #242430;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .45s;opacity:0;transform:translateY(45px) scale(.96)}.movie.visible{opacity:1;transform:translateY(0) scale(1);transition:opacity .85s ease,transform .85s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s}.movie.visible:hover{transform:translateY(-9px) scale(1.025);border-color:#e5091488;box-shadow:0 18px 35px #0008,0 0 24px #e5091420}.poster{height:225px;background:linear-gradient(145deg,#242432,#50151c);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:900;font-size:20px;letter-spacing:1px;color:#fff;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.movie:hover .poster img{transform:scale(1.09)}.movie-info{padding:11px}.movie-info strong{display:block}.movie-info small{color:var(--muted)}.empty{grid-column:1/-1;padding:32px;border:1px dashed #444;border-radius:10px;color:var(--muted);text-align:center}
footer{padding:28px 5%;border-top:1px solid var(--line);color:#777;text-align:center}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:18px;z-index:10;backdrop-filter:blur(10px)}.modal.open{display:flex;animation:fade .35s both}.dialog{background:#171720;border:1px solid #393946;border-radius:12px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px;animation:modalUp .5s cubic-bezier(.2,.8,.2,1) both}.dialog-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.dialog h2{margin:5px 0 12px}.close{font-size:20px;padding:4px 11px}.detail-poster{height:230px;border-radius:8px;background:linear-gradient(145deg,#252536,#68151e);display:grid;place-items:center;font-size:30px;font-weight:900;margin:14px 0;overflow:hidden}.detail-poster img{width:100%;height:100%;object-fit:cover}.player{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000;margin-top:12px}.hint{font-size:12px;color:#999}
@keyframes dropIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}@keyframes heroAppear{from{opacity:0;transform:scale(1.035);filter:blur(9px)}to{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes glow{from{opacity:.35;transform:scale(.9)}to{opacity:1;transform:scale(1.15)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes modalUp{from{opacity:0;transform:translateY(35px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:700px){header{padding:0 4%;gap:12px}.nav{display:none}.search{width:125px}.hero{min-height:330px;padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.poster{height:190px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}.movie{opacity:1;transform:none}}

/* PUMBFLIX — kinowa oprawa */
body{background:radial-gradient(ellipse at 85% 0%,#2b0b13 0%,transparent 35%),#09090d}
header{height:78px;background:linear-gradient(180deg,#08080bf5,#0d0c11e8);box-shadow:0 12px 32px #0006}
.logo{font-size:clamp(23px,2.4vw,33px);letter-spacing:2px;font-family:Arial Black,Arial,sans-serif;transform:scaleX(1.02)}
.hero{min-height:clamp(400px,48vw,590px);margin-top:0;border-radius:0 0 18px 18px;padding:clamp(26px,5vw,70px);background:linear-gradient(90deg,#09090df5 0%,#110e15da 42%,#1b0b13a8 100%),radial-gradient(ellipse at 80% 35%,#a10c29 0%,#350c18 38%,#09090d 75%);box-shadow:inset 0 -90px 90px -85px #09090d}
.hero:before{background:radial-gradient(circle at 80% 43%,#f30c3260,transparent 30%);filter:blur(15px)}
.hero-content{position:relative;z-index:1}
.hero h1{font-size:clamp(46px,7.5vw,92px);font-weight:900;letter-spacing:-3px;text-shadow:0 7px 32px #000b}
.hero p{font-size:clamp(15px,1.5vw,19px);line-height:1.7}
.eyebrow{letter-spacing:3px}
.primary{background:linear-gradient(135deg,#f31627,#b70815);box-shadow:0 8px 25px #e5091433}
.section-head{margin-top:38px}.section-head h2{font-size:clamp(22px,2.3vw,30px);letter-spacing:-.5px}
.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.movie{background:#15141b;border-color:#29232d;border-radius:9px}
.poster{height:260px;background:linear-gradient(135deg,#29202e,#7b101f)}
.movie-info{padding:14px}.movie-info strong{font-size:16px}
.movie-info small{display:block;margin-top:5px}
@media(max-width:700px){header{height:68px}.hero{min-height:390px;padding:25px}.hero h1{letter-spacing:-1.5px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.poster{height:210px}.movie-info{padding:10px}}


/* Katalog i prezentacja */
.hero{background-size:cover;background-position:center;transition:background-image .5s ease}
.hero:after{background:linear-gradient(90deg,#09090df5 0%,#09090dbb 48%,#09090d22 100%),linear-gradient(0deg,#09090d 0%,transparent 55%)}
.hero-controls{display:flex;gap:8px;margin-top:22px;align-items:center}.hero-dot{width:9px;height:9px;padding:0;border-radius:50%;background:#ffffff66}.hero-dot.active{background:#e50914;width:26px;border-radius:12px}
.hero-nav{position:absolute;right:24px;bottom:28px;display:flex;gap:8px;z-index:2}.hero-nav button{background:#0009;border:1px solid #ffffff55;font-size:22px}
.shelf{margin:32px 0 44px}.shelf h2{font-size:clamp(21px,2.4vw,29px);margin:0 0 17px}.shelf-sub{font-size:13px;color:#aaa;margin:-10px 0 20px}
.shelf .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.movie{position:relative}.movie:after{content:'▶';position:absolute;top:12px;right:12px;background:#e50914d9;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;opacity:0;transition:opacity .3s}.movie:hover:after,.movie:focus-visible:after{opacity:1}
#intro{position:fixed;inset:0;background:#08080c;display:grid;place-items:center;z-index:100;animation:introExit .8s ease 1.55s forwards;pointer-events:none}#intro span{font-size:clamp(36px,9vw,96px);font-weight:1000;color:#ed0b20;letter-spacing:.12em;text-shadow:0 0 40px #e5091477;animation:introLogo 1.4s ease both}
@keyframes introLogo{0%{opacity:0;transform:scale(.75);filter:blur(12px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1)}}@keyframes introExit{to{opacity:0;visibility:hidden}}
@media(max-width:700px){.hero-nav{right:12px;bottom:12px}.hero-nav button{padding:6px 10px}.shelf .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><span>PUMBFLIX</span></div>
<header><div class="logo">PUMBFLIX</div><nav class="nav"><a onclick="showHome()">Główna</a><a onclick="showCatalog()">Filmy</a></nav><div class="actions"><input class="search" id="search" placeholder="Szukaj filmu..." aria-label="Szukaj filmu" oninput="renderMovies()"><button class="primary" onclick="showCatalog()">Filmy</button></div></header>
<main>
<section class="hero" id="hero" aria-label="Polecany film">
 <div class="hero-content"><div class="eyebrow" id="heroTag">PUMBFLIX ORIGINAL</div><h1 id="heroTitle">TWOJE KINO.<br>TWOJE ZASADY.</h1><p id="heroDescription">Najciekawsze historie w jednym miejscu.</p><button class="primary" id="heroPlay" onclick="playFeatured()">▶ Oglądaj teraz</button><div class="hero-controls" id="heroDots"></div></div>
 <div class="hero-nav"><button onclick="changeFeatured(-1)" aria-label="Poprzedni film">‹</button><button onclick="changeFeatured(1)" aria-label="Następny film">›</button></div>
</section>
<section class="shelf" id="latestSection"><h2>✦ Ostatnio dodane</h2><div class="grid" id="latestMovies"></div></section>
<section class="shelf" id="popularSection"><h2>🔥 Popularne na PUMBFLIX</h2><div class="grid" id="popularMovies"></div></section>
<section class="shelf" id="catalogSection"><div class="section-head"><h2 id="catalogTitle">Wszystkie filmy</h2><span class="muted" id="count"></span></div><div class="grid" id="movies"></div></section>
</main>
<footer>PUMBFLIX · Twoja prywatna biblioteka filmowa</footer>
<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-label="Szczegóły filmu"><div class="dialog"><div class="dialog-top"><span class="eyebrow">SZCZEGÓŁY TYTUŁU</span><button class="close" onclick="closeModal()" aria-label="Zamknij">×</button></div><div id="detailContent"></div></div></div>
<script>
/* ======================================================================
DODAWANIE FILMÓW — EDYTUJ PONIŻSZĄ LISTĘ 
   ====================================================================== */
const FILMY = [
  // PRZYKŁAD — zamień dane na swoje:
  {
    tytul: "Jazda Grażynką",
    typ: "Film",
    kategoria: "Akcja",
    opis: "Spokojna jazda Grażynką na jałowym biegu.",
    link: "https://drive.google.com/file/d/1_GTFZywt8gaVLe1ueFWmBI3CyfGwyMbn/view?usp=sharing",
    plakat: "https://i.postimg.cc/xdY9Q5CZ/Zrzut-ekranu-2026-11-15-212029.jpg"
  }

  // KOLEJNY FILM? Dodaj przecinek po poprzednim bloku i wklej:
  // ,{
  //   tytul: "DRUGI FILM",
  //   typ: "Film",
  //   kategoria: "Przygodowy",
  //   opis: "Opis drugiego filmu",
  //   link: "https://drive.google.com/file/d/TUTAJ_ID/view",
  //   plakat: ""
  // }
];

const $=id=>document.getElementById(id);
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getDriveId(value){try{const u=new URL(String(value));if(u.protocol!=='https:'||!['drive.google.com','docs.google.com'].includes(u.hostname))return null;const match=u.pathname.match(/^\/file\/d\/([\w-]+)/);const id=match?match[1]:u.searchParams.get('id');return id&&/^[\w-]{10,}$/.test(id)?id:null}catch{return null}}
function safeImage(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:''}catch{return ''}}
const movies=FILMY.filter(m=>getDriveId(m.link)&&!m.link.includes('TUTAJ_'));
let observer;
function movieCard(m,id){const card=document.createElement('article');card.className='movie';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Otwórz '+m.tytul);card.onclick=()=>showDetail(id);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(id)}};const img=safeImage(m.plakat);card.innerHTML='<div class="poster">'+(img?'<img src="'+escapeHTML(img)+'" alt="" loading="lazy">':escapeHTML(m.tytul))+'</div><div class="movie-info"><strong>'+escapeHTML(m.tytul)+'</strong><small>'+escapeHTML(m.typ||'Film')+' · '+escapeHTML(m.kategoria||'Inne')+'</small></div>';return card}
function fillGrid(id,items){const root=$(id);root.replaceChildren();items.forEach(({m,id},i)=>{const card=movieCard(m,id);root.append(card);card.style.transitionDelay=Math.min(i%10*65,585)+'ms';if(observer)observer.observe(card);else card.classList.add('visible')})}
function renderMovies(){const q=$('search').value.trim().toLocaleLowerCase('pl');const all=movies.map((m,id)=>({m,id}));const filtered=all.filter(({m})=>(m.tytul+' '+m.kategoria+' '+m.typ).toLocaleLowerCase('pl').includes(q));$('count').textContent=filtered.length+' tytułów';if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.08});fillGrid('movies',filtered);if(!filtered.length)$('movies').innerHTML='<div class="empty">Brak filmów do wyświetlenia.</div>';const searching=!!q;$('latestSection').hidden=searching;$('popularSection').hidden=searching;if(!searching){fillGrid('latestMovies',all.slice().reverse().slice(0,6));fillGrid('popularMovies',all.slice(0,6));$('latestSection').hidden=!all.length;$('popularSection').hidden=!all.length}}
let featured=0,featuredTimer;
function updateFeatured(){if(!movies.length){$('heroPlay').hidden=true;return}const m=movies[featured];$('heroTag').textContent=(m.kategoria||'Polecane')+' · '+(m.typ||'Film');$('heroTitle').textContent=m.tytul;$('heroDescription').textContent=m.opis||'Odkryj nową historię.';const img=safeImage(m.plakat);$('hero').style.backgroundImage=img?'linear-gradient(90deg,#09090df2 0%,#09090d88 60%,#09090d44 100%),url("'+img.replace(/"/g,'%22')+'")':'';$('heroDots').replaceChildren();movies.slice(0,8).forEach((_,i)=>{const dot=document.createElement('button');dot.className='hero-dot'+(i===featured?' active':'');dot.setAttribute('aria-label','Pokaż film '+(i+1));dot.onclick=()=>{featured=i;updateFeatured();resetFeaturedTimer()};$('heroDots').append(dot)})}
function changeFeatured(step){if(!movies.length)return;featured=(featured+step+Math.min(movies.length,8))%Math.min(movies.length,8);updateFeatured();resetFeaturedTimer()}
function playFeatured(){if(movies.length)showDetail(featured)}
function resetFeaturedTimer(){clearInterval(featuredTimer);if(movies.length>1&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)featuredTimer=setInterval(()=>{featured=(featured+1)%Math.min(movies.length,8);updateFeatured()},6500)}
function showDetail(id){const m=movies[id];if(!m)return;const driveId=getDriveId(m.link);if(!driveId)return;const img=safeImage(m.plakat);const poster=img?'<img src="'+escapeHTML(img)+'" alt="">':escapeHTML(m.tytul);$('detailContent').innerHTML='<h2>'+escapeHTML(m.tytul)+'</h2><div class="muted">'+escapeHTML(m.typ||'Film')+' · '+escapeHTML(m.kategoria||'Inne')+'</div><div class="detail-poster">'+poster+'</div><p>'+escapeHTML(m.opis||'Brak opisu.')+'</p><iframe class="player" src="https://drive.google.com/file/d/'+encodeURIComponent(driveId)+'/preview" title="'+escapeHTML(m.tytul)+'" allow="autoplay; fullscreen" allowfullscreen></iframe>';$('detailModal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('detailModal').classList.remove('open');$('detailContent').replaceChildren();document.body.style.overflow=''}
$('detailModal').addEventListener('click',e=>{if(e.target===$('detailModal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function showHome(){window.scrollTo({top:0,behavior:'smooth'});$('catalogTitle').textContent='Wszystkie filmy'}function showCatalog(){$('catalogTitle').textContent='Cały katalog';$('catalogSection').scrollIntoView({behavior:'smooth'})}renderMovies();updateFeatured();resetFeaturedTimer();
</script>
</body></html>
