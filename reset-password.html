<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMBFLIX — Zmiana hasła</title>
<link rel="icon" type="image/png" href="/favicon.png">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #09090d;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.box {
    width: 100%;
    max-width: 420px;
    background: #17171f;
    border: 1px solid #33333d;
    border-radius: 15px;
    padding: 35px;
    box-shadow: 0 20px 70px #0009;
}

.logo {
    color: #e50914;
    font-size: 35px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 10px;
}

h2 { text-align: center; }

p {
    color: #aaa;
    text-align: center;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    background: #252530;
    border: 1px solid #444;
    border-radius: 7px;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #e50914;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    text-align: center;
    overflow-wrap: anywhere;
}

a { color: #ff555e; }
</style>
</head>

<body>

<div class="box">
    <div class="logo">PUMBFLIX</div>

    <h2>🔐 Zmiana hasła</h2>
    <p>Ustaw nowe hasło do panelu administratora.</p>

    <form id="resetForm" hidden>
        <input
            type="password"
            id="password"
            placeholder="Nowe hasło"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <input
            type="password"
            id="confirm"
            placeholder="Powtórz nowe hasło"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <button id="submitButton" type="submit">
            ZAPISZ NOWE HASŁO
        </button>
    </form>

    <div id="message">Sprawdzanie linku...</div>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    'https://baclnodzztvctqpnyvrw.supabase.co',
    'sb_publishable_XmykZIkmy9Nzl3RKPmHwow_qFblt7j-',
    {
        auth: {
            detectSessionInUrl: true,
            persistSession: false,
            autoRefreshToken: false
        }
    }
);

const form = document.getElementById('resetForm');
const message = document.getElementById('message');
const button = document.getElementById('submitButton');

let recoveryVerified = false;

function showMessage(text) {
    message.textContent = text;
}

function enableForm() {
    recoveryVerified = true;
    form.hidden = false;
    showMessage('Link potwierdzony. Możesz ustawić nowe hasło.');
}

const params = new URLSearchParams(window.location.search);
const hash = new URLSearchParams(window.location.hash.slice(1));

async function verifyRecovery() {
    const error = params.get('error_description')
        || hash.get('error_description');

    if (error) {
        showMessage('Link jest nieprawidłowy lub wygasł. Poproś o nowy.');
        return;
    }

    const tokenHash = params.get('token_hash');
    const type = params.get('type');

    if (tokenHash && type === 'recovery') {
        const { error: verifyError } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
        });

        if (verifyError) {
            showMessage('Nie udało się potwierdzić linku: ' + verifyError.message);
            return;
        }

        enableForm();
        return;
    }

    if (hash.get('type') === 'recovery') {
        const { error: sessionError } = await supabase.auth.setSession({
            access_token: hash.get('access_token'),
            refresh_token: hash.get('refresh_token')
        });

        if (sessionError) {
            showMessage('Link jest nieprawidłowy lub wygasł.');
            return;
        }

        enableForm();
        return;
    }

    showMessage('Otwórz tę stronę za pomocą linku odzyskiwania hasła.');
}

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    if (!recoveryVerified) return;

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password.length < 12) {
        showMessage('Hasło musi mieć co najmniej 12 znaków.');
        return;
    }

    if (password !== confirm) {
        showMessage('Hasła nie są identyczne.');
        return;
    }

    button.disabled = true;
    showMessage('Zapisywanie nowego hasła...');

    const { error } = await supabase.auth.updateUser({
        password
    });

    if (error) {
        showMessage('Błąd: ' + error.message);
        button.disabled = false;
        return;
    }

    await supabase.auth.signOut();

    form.hidden = true;
    showMessage('Hasło zostało zmienione! Możesz wrócić do panelu administratora.');

    const link = document.createElement('a');
    link.href = '/admin/';
    link.textContent = 'PRZEJDŹ DO LOGOWANIA';

    message.appendChild(document.createElement('br'));
    message.appendChild(link);
});

verifyRecovery().catch(() => {
    showMessage('Nie udało się sprawdzić linku. Spróbuj ponownie.');
});
</script>

</body>
</html>
